# Baut dewz für Windows, macOS und Linux und hängt die Installer an ein GitHub-Release.
#
# Auslösen: einen Versions-Tag pushen, z. B.
#   git tag v0.1.0 && git push origin v0.1.0
# (oder manuell unter Actions → Release → "Run workflow").
# Das Release wird als Entwurf angelegt und muss auf GitHub noch veröffentlicht werden.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        id: tauri
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: dewz ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseBody: Installer für Windows (.msi/.exe), macOS (.dmg) und Linux (.deb/.rpm/.AppImage) siehe unten. Windows ohne Installation – dewz_…_x64-portable.zip entpacken und dewz.exe starten.
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}

      # Portable Windows-Version: nur dewz.exe (plus Lizenz) als ZIP, läuft ohne Installation, solange die
      # WebView2-Laufzeit vorhanden ist (ab Windows 10/11 vorinstalliert).
      - name: Upload portable Windows build
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ steps.tauri.outputs.releaseId }}
          VERSION: ${{ steps.tauri.outputs.appVersion }}
        run: |
          name="dewz_${VERSION}_x64-portable.zip"
          mkdir portable
          cp src-tauri/target/release/dewz.exe LICENSE portable/
          (cd portable && 7z a -tzip "../$name" dewz.exe LICENSE)
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"$name" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}"
