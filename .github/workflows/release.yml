# Baut dewz für Windows, macOS und Linux und hängt die Installer an ein GitHub-Release.
#
# Auslösen: einen Versions-Tag pushen, z. B.
#   git tag v0.1.0 && git push origin v0.1.0
# (oder manuell unter Actions → Release → "Run workflow").
# Das Release wird als Entwurf angelegt und muss auf GitHub noch veröffentlicht werden.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Legt den Release-Entwurf genau einmal an, bevor die Builds starten. Würden die vier Build-Jobs das
  # selbst tun, liefen sie parallel in einen Wettlauf (mehrere Entwürfe, abgebrochene Uploads).
  # Bei einem erneuten Lauf wird ein vorhandener Entwurf mit demselben Tag wiederverwendet.
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(jq -r .version src-tauri/tauri.conf.json)
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then tag="$GITHUB_REF_NAME"; else tag="v$version"; fi

          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases" \
            --jq ".[] | select(.tag_name == \"$tag\" and .draft) | .id" | tail -n1)

          if [ -z "$id" ]; then
            id=$(gh api -X POST "repos/$GITHUB_REPOSITORY/releases" \
              -f tag_name="$tag" \
              -f target_commitish="$GITHUB_SHA" \
              -f name="dewz $tag" \
              -f body="Installer für Windows (.msi/.exe), macOS (.dmg) und Linux (.deb/.rpm/.AppImage) siehe unten. Windows ohne Installation – dewz_…_x64-portable.zip entpacken und dewz.exe starten." \
              -F draft=true \
              -F prerelease=false \
              --jq .id)
            echo "Created draft release $id for $tag"
          else
            echo "Reusing existing draft release $id for $tag"
          fi

          echo "id=$id" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: Build (${{ matrix.name }})
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            platform: windows-latest
            args: ""
          - name: macOS Apple Silicon
            platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - name: macOS Intel
            platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - name: Linux x64
            platform: ubuntu-22.04
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf

      - uses: actions/setup-node@v5
        with:
          node-version: lts/*
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install npm dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          args: ${{ matrix.args }}

      # Portable Windows-Version: nur dewz.exe (plus Lizenz) als ZIP, läuft ohne Installation, solange die
      # WebView2-Laufzeit vorhanden ist (ab Windows 10/11 vorinstalliert).
      - name: Upload portable Windows build
        if: runner.os == 'Windows'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
          VERSION: ${{ needs.create-release.outputs.version }}
        run: |
          name="dewz_${VERSION}_x64-portable.zip"
          mkdir portable
          cp src-tauri/target/release/dewz.exe LICENSE portable/
          (cd portable && 7z a -tzip "../$name" dewz.exe LICENSE)
          # Bei einem erneuten Lauf liegt die ZIP schon am Entwurf – vorher löschen, sonst antwortet GitHub mit 422.
          GH_TOKEN="$GITHUB_TOKEN" gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" \
            --jq ".[] | select(.name == \"$name\") | .id" | while read -r asset_id; do
            GH_TOKEN="$GITHUB_TOKEN" gh api -X DELETE "repos/${GITHUB_REPOSITORY}/releases/assets/${asset_id}"
          done
          curl --fail-with-body -sS -X POST \
            -H "Authorization: Bearer $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"$name" \
            "https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets?name=${name}"
